{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"ForensiQ Workstation" }}</title>

    <!-- Theme Initialization & Mode Manager (Prevents FOUC) -->
    <script src="{% static 'ui/js/theme-manager.js' %}"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS + Centralized Theme Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'ui/js/tailwind-theme.js' %}"></script>

    <!-- Tabulator.js (Standard Library) -->
    <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>

    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <!-- Alpine.js Core Framework -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <!-- ForensiQ Centralized Design Tokens & Stylesheet -->
    <link rel="stylesheet" href="{% static 'ui/css/theme.css' %}">
</head>

<body
    class="bg-[#f4ecf5] dark:bg-[#140a17] text-slate-900 dark:text-zinc-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Top Navigation Command Bar -->
    <header
        class="bg-white/90 dark:bg-[#190d1d]/85 backdrop-blur-md border-b border-[#e4d5e6] dark:border-[#351c3a] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

            <!-- Brand Logo -->
            <div class="flex items-center">
                <a href="/" class="flex items-center group select-none">
                    <span
                        class="text-xl font-black tracking-tight text-slate-900 dark:text-white flex items-center leading-none">
                        <span>Forensi</span>
                        <img src="{% static 'core/images/letter_q_orange.png' %}" alt="Q"
                            class="inline-block h-[1.18em] w-auto ml-[0.05em] translate-y-[0.08em] filter drop-shadow-[0_2px_6px_rgba(245,158,11,0.3)] group-hover:scale-105 transition transform">
                    </span>
                </a>
            </div>

            <!-- Right Controls: Lock/Logout & Theme Switcher -->
            <div class="flex items-center space-x-2.5">
                {% if request.session.portal_authenticated %}
                <a href="{% url 'portal_logout' %}" title="Lock Workstation & Logout"
                    class="h-9 px-3 rounded-lg flex items-center gap-1.5 text-xs font-semibold text-slate-600 dark:text-zinc-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 border border-[#e4d5e6] dark:border-zinc-800 transition">
                    <i class="fa-solid fa-lock text-xs"></i>
                    <span class="hidden sm:inline">Lock</span>
                </a>
                {% endif %}

                <!-- Dark / Light Mode Toggle Button -->
                <button id="theme-toggle" type="button" aria-label="Toggle Dark Mode"
                    class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 dark:text-zinc-400 hover:bg-[#efe4f1] dark:hover:bg-zinc-800 border border-[#e4d5e6] dark:border-zinc-800 transition">
                    <i id="theme-toggle-dark-icon" class="hidden fa-solid fa-moon text-sm text-sky-400"></i>
                    <i id="theme-toggle-light-icon" class="hidden fa-solid fa-sun text-sm text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        {{ slot }}
    </main>

    <!-- Footer -->
    <footer
        class="bg-white dark:bg-[#190d1d] border-t border-[#e4d5e6] dark:border-[#351c3a] py-4 text-center text-xs text-slate-500 dark:text-zinc-400">
        ForensiQ &bull; Forensic Investigation & Data Analytics Workstation
    </footer>

    <!-- Global Helpers (Modal & CSRF) -->
    <script>
        // Global Modal Management
        window.openModal = function (id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
        };

        window.closeModal = function (id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }
        };

        // CSRF Token Helper
        window.getCookie = function (name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        };

        document.addEventListener('click', function (e) {
            const closeBtn = e.target.closest('[data-modal-close]');
            if (closeBtn) {
                const modalId = closeBtn.getAttribute('data-modal-close');
                window.closeModal(modalId);
            }
        });
    </script>
</body>

</html>

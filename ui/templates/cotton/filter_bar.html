<div class="bg-theme-surface rounded-xl border border-theme-border shadow-sm p-4 mb-6 {{ class }}">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-{{ cols|default:'4' }} gap-3">
        {{ slot }}
    </div>

    {% if summary or actions %}
    <div class="mt-3.5 pt-3 border-t border-theme-border flex items-center justify-between text-xs text-theme-muted flex-wrap gap-2">
        <div class="flex items-center space-x-3">
            {{ summary }}
        </div>
        <div class="flex items-center space-x-2">
            {{ actions }}
        </div>
    </div>
    {% endif %}
</div>

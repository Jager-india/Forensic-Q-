<div class="bg-theme-surface rounded-xl border border-theme-border shadow-sm overflow-hidden {{ class }}">
    {% if title or actions %}
    <div class="p-4 sm:p-5 border-b border-theme-border flex items-center justify-between gap-4">
        <div class="flex items-center space-x-2.5">
            {% if icon %}
            <div class="w-8 h-8 rounded-lg bg-theme-subtle flex items-center justify-center {{ icon_color|default:'text-theme-text' }} text-sm">
                <i class="{{ icon }}"></i>
            </div>
            {% endif %}
            <div>
                {% if title %}
                <h3 class="font-bold text-base text-theme-text tracking-tight">{{ title }}</h3>
                {% endif %}
                {% if subtitle %}
                <p class="text-xs text-theme-muted mt-0.5">{{ subtitle }}</p>
                {% endif %}
            </div>
        </div>

        {% if actions %}
        <div class="flex items-center space-x-2">
            {{ actions }}
        </div>
        {% endif %}
    </div>
    {% endif %}

    <div class="p-4 sm:p-5">
        {{ slot }}
    </div>

    {% if footer %}
    <div class="px-4 py-3 bg-theme-subtle/50 border-t border-theme-border text-xs text-theme-muted">
        {{ footer }}
    </div>
    {% endif %}
</div>
